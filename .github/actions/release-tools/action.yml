name: Pinned release tools
description: Install the maintained version tool without compiling the application
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
    - shell: bash
      run: npm ci --prefix release --ignore-scripts --no-audit --no-fund
    - shell: bash
      if: runner.os == 'Linux'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        version=2.14.2
        archive="git-cliff-${version}-x86_64-unknown-linux-gnu.tar.gz"
        directory="${RUNNER_TEMP}/git-cliff-${version}"
        mkdir -p "$directory"
        gh release download "v${version}" --repo orhun/git-cliff --pattern "$archive" --pattern "${archive}.sha512" --dir "$directory"
        cd "$directory"
        sha512sum --check "${archive}.sha512"
        tar xzf "$archive"
        echo "$directory/git-cliff-${version}" >> "$GITHUB_PATH"
    - shell: pwsh
      if: runner.os == 'Windows'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $directory = Join-Path $env:RUNNER_TEMP 'git-cliff-2.14.2'
        New-Item -ItemType Directory -Force $directory | Out-Null
        $archive = 'git-cliff-2.14.2-x86_64-pc-windows-msvc.zip'
        gh release download v2.14.2 --repo orhun/git-cliff --pattern $archive --dir $directory
        if ($LASTEXITCODE -ne 0) { throw 'git-cliff download failed' }
        $path = Join-Path $directory $archive
        if ((Get-FileHash $path -Algorithm SHA256).Hash -ne '6ECE2112B3F4AF462190ECBEA4AEB1315FFF6AF415629B597F84319073C31131') { throw 'git-cliff checksum mismatch' }
        Expand-Archive $path -DestinationPath $directory
        (Join-Path $directory 'git-cliff-2.14.2') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
