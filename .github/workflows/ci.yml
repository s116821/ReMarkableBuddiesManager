name: CI
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
  push:
    branches:
      - main
permissions:
  contents: read
  pull-requests: read
jobs:
  checks:
    name: Checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refuse an incomplete PR file inventory
        if: github.event_name == 'pull_request' && (github.event.pull_request.changed_files <= 0 || github.event.pull_request.changed_files >= 3000)
        run: exit 1
      - name: Require unambiguous main push range
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          SOURCE_SHA: ${{ github.sha }}
        run: python release/admission.py range --before "$BEFORE" --sha "$SOURCE_SHA"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: paths
        with:
          token: ${{ github.token }}
          filters: .github/application-paths.yml
          predicate-quantifier: every
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          ref: ${{ github.sha }}
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        if: github.event_name == 'pull_request' && steps.paths.outputs.application == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          requireScope: true
          types: |
            feat
            fix
            perf
            build
            ci
            chore
            refactor
            test
            revert
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: true
        if: github.event_name == 'pull_request' && steps.paths.outputs.application != 'true'
      - name: Summary-only PR body
        uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.pull_request.body || '').replace(/\r/g, '').trim();
            const lines = body.split('\n');
            if (lines.shift() !== '# Summary' || !lines.some(line => /^- \S/.test(line)) || lines.some(line => line.trim() && !/^(?:- \S|  \S)/.test(line))) {
              core.setFailed('Use exactly # Summary followed by concise bullets. Put detailed evidence in PR comments.');
            }
        if: github.event_name == 'pull_request'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
        if: steps.paths.outputs.application == 'true'
      - uses: ./.github/actions/release-tools
        if: steps.paths.outputs.application == 'true'
      - run: npm ci --no-audit --no-fund
        if: steps.paths.outputs.application == 'true'
      - run: npm run lint
        if: steps.paths.outputs.application == 'true'
      - run: npm test
        if: steps.paths.outputs.application == 'true'
      - run: npm run test:release
        if: steps.paths.outputs.application == 'true'
      - if: steps.paths.outputs.application == 'true' && (runner.os == 'Linux')
        run: |
          python -m pip install -r host/requirements.txt
          python -m unittest discover -s tests/wired -v
      - run: npm ci --prefix release/fixtures --ignore-scripts --no-audit --no-fund
        if: steps.paths.outputs.application == 'true'
      - run: npm audit --prefix release/fixtures
        if: steps.paths.outputs.application == 'true'
      - name: Verify CI stage and artifact gates
        run: node --test release/fixtures/workflow.test.mjs
        if: steps.paths.outputs.application == 'true'
    defaults:
      run:
        shell: bash
    outputs:
      application: ${{ steps.paths.outputs.application }}
  application:
    needs: checks
    if: needs.checks.outputs.application == 'true'
    uses: ./.github/workflows/pipeline.yml
    permissions:
      contents: write
      pull-requests: read
    with:
      source_sha: ${{ github.sha }}
      release: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
