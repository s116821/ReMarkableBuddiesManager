      - name: Bind the native retained test to the unpacked shipping oracle
        run: |
          python - <<'PY'
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path

          root = Path(os.environ['ORACLE_ROOT']).resolve(strict=True)
          manager = Path.cwd().resolve()
          receipt = json.loads((root / 'receipt.json').read_text())
          pin = json.loads((manager / 'host/buddy-oracle-source.json').read_text())
          assert receipt['source'] == pin
          windows = os.name == 'nt'
          target = 'x86_64-pc-windows-msvc' if windows else 'x86_64-unknown-linux-gnu'
          platform = 'win32' if windows else 'linux'
          record = receipt['platforms'][target]
          resource = manager / ('out/packages/ReMarkableBuddiesManager-' + platform + '-x64/resources/host/buddy-oracle')
          binary = resource / record['command']['name']
          test = root / target / record['test']['name']

          def sha(path):
              with path.open('rb') as stream:
                  return hashlib.file_digest(stream, 'sha256').hexdigest()

          assert resource.is_dir() and not resource.is_symlink()
          assert set(p.name for p in resource.iterdir()) == {record['command']['name'], 'provenance.json'}
          assert sha(resource / 'provenance.json') == record['provenance_sha256']
          assert (resource / 'provenance.json').read_bytes() == (root / target / 'buddy-oracle/provenance.json').read_bytes()
          assert binary.is_file() and not binary.is_symlink()
          assert binary.stat().st_size == record['command']['bytes'] and sha(binary) == record['command']['sha256']
          assert test.stat().st_size == record['test']['bytes'] and sha(test) == record['test']['sha256']
          if not windows:
              assert binary.stat().st_mode & 0o111
              # Only the two original hash-bound runtime inputs are restored. The test
              # binary's compile-time CARGO_MANIFEST_DIR must remain exact; do not skip it.
              original = Path(receipt['manifest_directory'])
              assert original == manager / 'out/buddy-oracle-source'
              original.mkdir(exist_ok=False)
