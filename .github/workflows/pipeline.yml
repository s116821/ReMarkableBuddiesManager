name: Ordered application pipeline
on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      release:
        type: boolean
        required: true
permissions:
  contents: read
concurrency:
  group: ${{ inputs.release && 'main-application-release' || format('pr-{0}', github.event.pull_request.number) }}
  queue: max
  cancel-in-progress: false
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.freeze.outputs.tag }}
      sha: ${{ steps.freeze.outputs.sha }}
      artifact_id: ${{ steps.artifacts.outputs.artifact-id }}
      development_artifact_id: ${{ steps.development.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-tools
        with:
          audit-dependencies: "false"
      - name: Read semantic candidate without creating any tag
        id: freeze
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          MAIN_RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          git checkout -B main "$SOURCE_SHA"
          tag=$(semantic-release -c cicd/release/python-semantic-release.toml version --print-tag)
          eligibility=()
          if test "$MAIN_RELEASE" = true; then eligibility+=(--require-semantic-source); fi
          python cicd/release/freeze.py candidate --tag "$tag" --sha "$SOURCE_SHA" "${eligibility[@]}"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build development, production and native packages
        env:
          MANAGER_CANDIDATE_TAG: ${{ steps.freeze.outputs.tag }}
          MANAGER_CANDIDATE_SHA: ${{ steps.freeze.outputs.sha }}
        run: |
          npm run build:development
          npm run build
          MANAGER_PACKAGE_PLATFORM=win32 npm run package
          MANAGER_PACKAGE_PLATFORM=linux npm run package
      - name: Assemble fixed release inventory
        run: python cicd/release/build.py assemble --tag "$TAG" --sha "$SHA" --output "$RUNNER_TEMP/packages"
        env:
          TAG: ${{ steps.freeze.outputs.tag }}
          SHA: ${{ steps.freeze.outputs.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: artifacts
        with:
          name: candidate-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: development
        with:
          name: development-browser-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: test-results/development/browser/
          if-no-files-found: error
          retention-days: 14
    defaults:
      run:
        shell: bash
  integration:
    name: Integration (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.build.outputs.tag }}
      SHA: ${{ needs.build.outputs.sha }}
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/packages
          merge-multiple: true
      - shell: bash
        run: python cicd/release/build.py verify --tag "$TAG" --sha "$SHA" --output "$RUNNER_TEMP/packages"
      - name: Extract verified Linux artifacts without rebuilding
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/manager/browser out/packages/ReMarkableBuddiesManager-linux-x64
          unzip -q "$RUNNER_TEMP/packages/manager-browser.zip" -d dist/manager/browser
          unzip -q "$RUNNER_TEMP/packages/manager-linux-x64.zip" -d out/packages/ReMarkableBuddiesManager-linux-x64
          cp dist/manager/browser/build-info.json electron/build-info.json
      - name: Extract verified Windows artifacts without rebuilding
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP/packages/manager-browser.zip" -DestinationPath dist/manager/browser
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP/packages/manager-win32-x64.zip" -DestinationPath out/packages/ReMarkableBuddiesManager-win32-x64
          Copy-Item -LiteralPath dist/manager/browser/build-info.json -Destination electron/build-info.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.development_artifact_id }}
          path: test-results/development/browser
          merge-multiple: true
      - name: Set trusted host interpreter for retained-package controls
        shell: bash
        run: |
          python - <<'PYTHON'
          import os, sys
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for name in ('MANAGER_WIRED_PYTHON', 'MANAGER_DRIVE_PYTHON'):
                  output.write(f'{name}={sys.executable}\n')
          PYTHON
      - run: npx playwright install --with-deps chromium
      - run: node tests/hosts.mjs --development
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pip install -r host/requirements.txt
          xvfb-run -a npm run test:hosts
          xvfb-run -a npm run test:package
          xvfb-run -a npm run test:wired-hosts
          xvfb-run -a npm run test:wired-hosts -- --packaged
          xvfb-run -a npm run test:owned-hosts
          xvfb-run -a npm run test:owned-hosts -- --packaged
          xvfb-run -a npm run test:drive-hosts
          xvfb-run -a npm run test:drive-hosts -- --packaged
          xvfb-run -a npm run test:personalization-hosts
          xvfb-run -a npm run test:personalization-hosts -- --packaged
          xvfb-run -a npm run test:runtime-identity-hosts
          xvfb-run -a npm run test:runtime-identity-hosts -- --packaged
          xvfb-run -a npm run test:manager-download-hosts
          xvfb-run -a npm run test:manager-download-hosts -- --packaged
          xvfb-run -a npm run test:memory-query-hosts
          xvfb-run -a npm run test:memory-query-hosts -- --packaged
          xvfb-run -a npm run test:memory-forget-hosts
          xvfb-run -a npm run test:memory-forget-hosts -- --packaged
          xvfb-run -a npm run test:memory-inspection-hosts
          xvfb-run -a npm run test:memory-inspection-hosts -- --packaged
          xvfb-run -a npm run test:saved-mode-hosts
          xvfb-run -a npm run test:saved-mode-hosts -- --packaged
          xvfb-run -a npm run test:saved-configuration-hosts
          xvfb-run -a npm run test:saved-configuration-hosts -- --packaged
          xvfb-run -a npm run test:basic-settings-hosts
          xvfb-run -a npm run test:basic-settings-hosts -- --packaged
          xvfb-run -a npm run test:product-settings-hosts
          xvfb-run -a npm run test:product-settings-hosts -- --packaged
          xvfb-run -a npm run test:product-maintenance-hosts
          xvfb-run -a npm run test:product-maintenance-hosts -- --packaged
          xvfb-run -a npm run test:product-lifetime-hosts
          xvfb-run -a npm run test:product-lifetime-hosts -- --packaged
          xvfb-run -a npm run test:owned-notebook-hosts
          xvfb-run -a npm run test:owned-notebook-hosts -- --packaged
          xvfb-run -a npm run test:storage-initialization-hosts
          xvfb-run -a npm run test:storage-initialization-hosts -- --packaged
          xvfb-run -a npm run test:local-mode-choice-hosts
          xvfb-run -a npm run test:local-mode-choice-hosts -- --packaged
          xvfb-run -a npm run test:isolated-root-hosts
          xvfb-run -a npm run test:isolated-root-hosts -- --packaged
          xvfb-run -a npm run test:isolated-backup-hosts
          xvfb-run -a npm run test:isolated-backup-hosts -- --packaged
          xvfb-run -a npm run test:model-settings-hosts
          xvfb-run -a npm run test:model-settings-hosts -- --packaged
          xvfb-run -a npm run test:research-settings-hosts
          xvfb-run -a npm run test:research-settings-hosts -- --packaged
          xvfb-run -a npm run test:memory-settings-hosts
          xvfb-run -a npm run test:credential-reference-hosts
          xvfb-run -a npm run test:model-credential-hosts
          xvfb-run -a npm run test:source-cache-inventory-hosts
          xvfb-run -a npm run test:conversation-inventory-hosts
          xvfb-run -a npm run test:conversation-management-hosts
          xvfb-run -a npm run test:ordinary-restore-hosts
          xvfb-run -a npm run test:selected-archive-hosts
          xvfb-run -a npm run test:notebook-archive-hosts
          xvfb-run -a npm run test:handwriting-records-hosts
          xvfb-run -a npm run test:source-cache-cleanup-hosts
          xvfb-run -a npm run test:memory-settings-hosts -- --packaged
          xvfb-run -a npm run test:credential-reference-hosts -- --packaged
          xvfb-run -a npm run test:model-credential-hosts -- --packaged
          xvfb-run -a npm run test:source-cache-inventory-hosts -- --packaged
          xvfb-run -a npm run test:conversation-inventory-hosts -- --packaged
          xvfb-run -a npm run test:conversation-management-hosts -- --packaged
          xvfb-run -a npm run test:ordinary-restore-hosts -- --packaged
          xvfb-run -a npm run test:selected-archive-hosts -- --packaged
          xvfb-run -a npm run test:notebook-archive-hosts -- --packaged
          xvfb-run -a npm run test:handwriting-records-hosts -- --packaged
          xvfb-run -a npm run test:source-cache-cleanup-hosts -- --packaged
          xvfb-run -a npm run test:ordinary-export-hosts
          xvfb-run -a npm run test:ordinary-export-hosts -- --packaged
          xvfb-run -a npm run test:portable-configuration-hosts
          xvfb-run -a npm run test:portable-configuration-hosts -- --packaged
          xvfb-run -a npm run test:shared-preferences-hosts
          xvfb-run -a npm run test:shared-preferences-hosts -- --packaged
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          npm run test:hosts
          npm run test:package
          npm run test:wired-hosts
          npm run test:wired-hosts -- --packaged
          npm run test:owned-hosts
          npm run test:owned-hosts -- --packaged
          npm run test:drive-hosts
          npm run test:drive-hosts -- --packaged
          npm run test:personalization-hosts
          npm run test:personalization-hosts -- --packaged
          npm run test:runtime-identity-hosts
          npm run test:runtime-identity-hosts -- --packaged
          npm run test:manager-download-hosts
          npm run test:manager-download-hosts -- --packaged
          npm run test:memory-query-hosts
          npm run test:memory-query-hosts -- --packaged
          npm run test:memory-forget-hosts
          npm run test:memory-forget-hosts -- --packaged
          npm run test:memory-inspection-hosts
          npm run test:memory-inspection-hosts -- --packaged
          npm run test:saved-mode-hosts
          npm run test:saved-mode-hosts -- --packaged
          npm run test:saved-configuration-hosts
          npm run test:saved-configuration-hosts -- --packaged
          npm run test:basic-settings-hosts
          npm run test:basic-settings-hosts -- --packaged
          npm run test:product-settings-hosts
          npm run test:product-settings-hosts -- --packaged
          npm run test:product-maintenance-hosts
          npm run test:product-maintenance-hosts -- --packaged
          npm run test:product-lifetime-hosts
          npm run test:product-lifetime-hosts -- --packaged
          npm run test:owned-notebook-hosts
          npm run test:owned-notebook-hosts -- --packaged
          npm run test:storage-initialization-hosts
          npm run test:storage-initialization-hosts -- --packaged
          npm run test:local-mode-choice-hosts
          npm run test:local-mode-choice-hosts -- --packaged
          npm run test:isolated-root-hosts
          npm run test:isolated-root-hosts -- --packaged
          npm run test:isolated-backup-hosts
          npm run test:isolated-backup-hosts -- --packaged
          npm run test:model-settings-hosts
          npm run test:model-settings-hosts -- --packaged
          npm run test:research-settings-hosts
          npm run test:research-settings-hosts -- --packaged
          npm run test:memory-settings-hosts
          npm run test:credential-reference-hosts
          npm run test:model-credential-hosts
          npm run test:source-cache-inventory-hosts
          npm run test:conversation-inventory-hosts
          npm run test:conversation-management-hosts
          npm run test:ordinary-restore-hosts
          npm run test:selected-archive-hosts
          npm run test:notebook-archive-hosts
          npm run test:handwriting-records-hosts
          npm run test:source-cache-cleanup-hosts
          npm run test:memory-settings-hosts -- --packaged
          npm run test:credential-reference-hosts -- --packaged
          npm run test:model-credential-hosts -- --packaged
          npm run test:source-cache-inventory-hosts -- --packaged
          npm run test:conversation-inventory-hosts -- --packaged
          npm run test:conversation-management-hosts -- --packaged
          npm run test:ordinary-restore-hosts -- --packaged
          npm run test:selected-archive-hosts -- --packaged
          npm run test:notebook-archive-hosts -- --packaged
          npm run test:handwriting-records-hosts -- --packaged
          npm run test:source-cache-cleanup-hosts -- --packaged
          npm run test:ordinary-export-hosts
          npm run test:ordinary-export-hosts -- --packaged
          npm run test:portable-configuration-hosts
          npm run test:portable-configuration-hosts -- --packaged
          npm run test:shared-preferences-hosts
          npm run test:shared-preferences-hosts -- --packaged
      - name: Confirm integration preserved upload bytes
        shell: bash
        run: python cicd/release/build.py verify --tag "$TAG" --sha "$SHA" --output "$RUNNER_TEMP/packages"
      - name: Preserve Windows native API and NTFS custody controls
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install -r host/requirements.txt
          python -m unittest discover -s tests/wired -p test_windows.py -k WindowsNative -v
          python -m unittest discover -s tests/drive -p test_store.py -k test_actual_broad_ntfs_grant_refuses -v
          python -m unittest discover -s tests/drive -p test_store.py -k test_isolated_writer_process_exit_releases_lock_without_touching_oauth -v
          node --test tests/isolated-backup-staging.test.mjs tests/drive-read-guard.test.mjs
      - name: Configure native host qualification paths
        if: ${{ !inputs.release }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          windows = os.environ["RUNNER_OS"] == "Windows"
          values = dict(CARGO_TARGET_DIR=str(Path(os.environ["RUNNER_TEMP"]) / "buddy-oracle-target"),
              ORACLE_TARGET="x86_64-pc-windows-msvc" if windows else "x86_64-unknown-linux-gnu",
              ORACLE_FILENAME="reader-buddy.exe" if windows else "reader-buddy")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for key, value in values.items():
                  env.write(key + "=" + value + "\n")
          PY
      - name: Read the exact host dependency pin
        if: ${{ !inputs.release }}
        id: pin
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          pin = json.loads(Path("host/buddy-oracle-source.json").read_text())
          assert set(pin) == {"schema", "repository", "sourceSha", "sourceTree", "cargoLockSha256", "sdkRevision"}
          assert pin["schema"] == 1 and pin["repository"] == "s116821/ReMarkableBuddies"
          for field in ("sourceSha", "sourceTree", "sdkRevision"):
              assert re.fullmatch("[0-9a-f]{40}", pin[field])
          assert re.fullmatch("[0-9a-f]{64}", pin["cargoLockSha256"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("source_sha=" + pin["sourceSha"] + "\n")
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !inputs.release }}
        with:
          repository: s116821/ReMarkableBuddies
          ref: ${{ steps.pin.outputs.source_sha }}
          path: buddy-oracle-source
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        if: ${{ !inputs.release }}
        with:
          toolchain: stable
          targets: ${{ env.ORACLE_TARGET }}
      - name: Admit source and build the ordinary host command
        if: ${{ !inputs.release }}
        working-directory: buddy-oracle-source
        run: |
          python - <<'PY'
          import hashlib, json, os, shutil, subprocess, tomllib
          from pathlib import Path
          pin = json.loads(Path("../host/buddy-oracle-source.json").read_text())
          def git(*args):
              return subprocess.check_output(["git", *args])
          assert git("rev-parse", "HEAD").decode().strip() == pin["sourceSha"]
          assert git("rev-parse", "HEAD^{tree}").decode().strip() == pin["sourceTree"]
          assert not git("status", "--porcelain", "--untracked-files=normal").strip()
          lock = git("show", "HEAD:Cargo.lock")
          assert hashlib.sha256(lock).hexdigest() == pin["cargoLockSha256"]
          sdk = [p for p in tomllib.loads(lock.decode())["package"] if p["name"] == "remarkable-open-sdk"]
          assert len(sdk) == 1 and sdk[0]["source"].endswith("#" + pin["sdkRevision"])
          # One native release/test target. Estimate from the existing ~4.1 GiB
          # source target plus shipping/test outputs; no persistent CI cache.
          for volume in (Path.cwd(), Path(os.environ["RUNNER_TEMP"])):
              free = shutil.disk_usage(volume).free
              print("Build volume free bytes:", free)
              assert free >= 8 * 1024**3, "Insufficient room for this host build"
          PY
          cargo build --locked --release --target "$ORACLE_TARGET" --bin reader-buddy
      - name: Retain the exact ordinary executable and its provenance
        if: ${{ !inputs.release }}
        working-directory: buddy-oracle-source
        run: |
          python - <<'PY'
          import hashlib, json, os, platform, shutil, subprocess
          from pathlib import Path
          pin = json.loads(Path("../host/buddy-oracle-source.json").read_text())
          output = Path(os.environ["RUNNER_TEMP"]) / "buddy-host-oracle"
          resource = output / "buddy-oracle"
          resource.mkdir(parents=True, exist_ok=False)
          binary = resource / os.environ["ORACLE_FILENAME"]
          shutil.copy2(Path(os.environ["CARGO_TARGET_DIR"]) / os.environ["ORACLE_TARGET"] / "release" / binary.name, binary)
          def sha(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()
          clean_env = {k: os.environ[k] for k in ("PATH", "SystemRoot", "WINDIR") if k in os.environ}
          version = subprocess.run([str(binary), "--version"], capture_output=True, check=True, timeout=10, env=clean_env)
          assert not version.stderr and len(version.stdout) <= 256
          version = version.stdout.decode().strip().split()
          assert len(version) == 2 and version[-1].startswith("dev."), "Do not fabricate published-tag identity"
          version = version[-1]
          rustc = subprocess.check_output(["rustc", "--version"], timeout=10).decode().strip()
          assert len(rustc) <= 256 and "\n" not in rustc
          metadata = dict(schema=1, source=pin, target=os.environ["ORACLE_TARGET"],
              profile="release", features=[], rustc=rustc, version=version,
              executable=dict(name=binary.name, bytes=binary.stat().st_size, sha256=sha(binary)))
          (resource / "provenance.json").write_text(json.dumps(metadata, indent=2) + "\n", encoding="utf-8")
          # Source/license inputs accompany qualification, outside the command's
          # closed runtime directory. Dependency notices remain a packaging gate.
          shutil.copyfile("LICENSE", output / "LICENSE")
          (output / "Cargo.lock").write_bytes(subprocess.check_output(["git", "show", "HEAD:Cargo.lock"]))
          (output / "host-platform.json").write_text(json.dumps(dict(platform=platform.platform(),
              libc=platform.libc_ver(), image=os.environ.get("ImageOS"),
              imageVersion=os.environ.get("ImageVersion")), indent=2) + "\n", encoding="utf-8")
          command = str(binary.resolve(strict=True))
          if os.name == "nt":
              # Rust fs::canonicalize retains the Win32 verbatim prefix.
              command = os.path.realpath("\\\\?\\" + command, strict=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for key, value in {"COMMAND": command, "SHA256": metadata["executable"]["sha256"],
                                 "BYTES": str(metadata["executable"]["bytes"])}.items():
                  env.write("READER_BUDDY_ARCHIVE_TEST_" + key + "=" + value + "\n")
          print(json.dumps(metadata, indent=2))
          PY
      - name: Exercise the retained command through the normal archive tests
        if: ${{ !inputs.release }}
        working-directory: buddy-oracle-source
        run: cargo test --locked --release --target "$ORACLE_TARGET" --test archive_cli -- --nocapture
      - name: Confirm qualification did not replace the retained bytes
        if: ${{ !inputs.release }}
        run: |
          python - <<'PY'
          import hashlib, os, tarfile
          from pathlib import Path
          binary = Path(os.environ["READER_BUDDY_ARCHIVE_TEST_COMMAND"])
          assert binary.stat().st_size == int(os.environ["READER_BUDDY_ARCHIVE_TEST_BYTES"])
          with binary.open("rb") as source:
              assert hashlib.file_digest(source, "sha256").hexdigest() == os.environ["READER_BUDDY_ARCHIVE_TEST_SHA256"]
          # Artifact services do not preserve executable permissions. Keep them
          # inside a normal tar, with the source receipt and license inputs.
          output = binary.parent.parent
          with tarfile.open(output.with_suffix(".tar"), "w") as archive:
              for name in ("buddy-oracle", "LICENSE", "Cargo.lock", "host-platform.json"):
                  archive.add(output / name, arcname=name)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !inputs.release }}
        with:
          name: buddy-host-oracle-${{ env.ORACLE_TARGET }}-${{ steps.pin.outputs.source_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/buddy-host-oracle.tar
          if-no-files-found: error
          retention-days: 7
    defaults:
      run:
        shell: bash
  release:
    name: Release
    timeout-minutes: 20
    needs:
      - build
      - integration
    if: inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      TAG: ${{ needs.build.outputs.tag }}
      SHA: ${{ needs.build.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: ./.github/actions/release-tools
        with:
          audit-dependencies: "false"
      - uses: octokit/graphql-action@ddde8ebb2493e79f390e6449c725c21663a67505
        id: merged
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          query: |
            query($owner: String!, $repo: String!, $sha: String!) {
              repository(owner: $owner, name: $repo) {
                object(expression: $sha) { ... on Commit {
                  oid associatedPullRequests(first: 10) { nodes {
                    merged baseRefName mergeCommit { oid }
                  } }
                } }
              }
            }
          variables: |
            owner: ${{ github.repository_owner }}
            repo: ${{ github.event.repository.name }}
            sha: ${{ needs.build.outputs.sha }}
      - name: Require exact merged-main admission
        env:
          RELEASE_OBSERVATION: ${{ steps.merged.outputs.data }}
        run: python cicd/release/admission.py merge --sha "$SHA"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/packages
          merge-multiple: true
      - name: Verify the exact integration-tested upload inventory
        run: python cicd/release/build.py verify --tag "$TAG" --sha "$SHA" --output "$RUNNER_TEMP/packages"
      - name: Official tag only after every preceding job passed
        run: |
          set -euo pipefail
          git checkout -B main "$SHA"
          python cicd/release/freeze.py candidate --require-semantic-source --tag "$TAG" --sha "$SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main --tags
          git merge-base --is-ancestor "$SHA" refs/remotes/origin/main
          test "$(semantic-release -c cicd/release/python-semantic-release.toml version --print-tag)" = "$TAG"
          semantic-release -c cicd/release/python-semantic-release.toml version --no-commit --no-changelog --skip-build --push --no-vcs-release
          python cicd/release/freeze.py remote --tag "$TAG" --sha "$SHA"
      - uses: octokit/graphql-action@ddde8ebb2493e79f390e6449c725c21663a67505
        id: lookup
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          query: |
            query($owner: String!, $repo: String!, $tag: String!) {
              repository(owner: $owner, name: $repo) {
                release(tagName: $tag) {
                  databaseId tagName isDraft description
                  releaseAssets(first: 1) { totalCount }
                }
              }
            }
          variables: |
            owner: ${{ github.repository_owner }}
            repo: ${{ github.event.repository.name }}
            tag: ${{ needs.build.outputs.tag }}
      - name: Validate exact release observation
        id: lookup_proof
        env:
          RELEASE_OBSERVATION: ${{ steps.lookup.outputs.data }}
        run: python cicd/release/verify_release.py lookup --tag "$TAG" --sha "$SHA"
      - uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae
        id: create
        if: steps.lookup_proof.outputs.absent == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          route: POST /repos/{repo}/releases
          repo: ${{ github.repository }}
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ needs.build.outputs.sha }}
          draft: true
          name: ${{ needs.build.outputs.tag }}
      - uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae
        id: before_upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          route: GET /repos/{repo}/releases/{release_id}
          repo: ${{ github.repository }}
          release_id: ${{ steps.create.outputs.data && fromJSON(steps.create.outputs.data).id || steps.lookup_proof.outputs.release_id }}
      - name: Verify retained bytes and select only missing names
        id: retained
        env:
          RELEASE_OBSERVATION: ${{ steps.before_upload.outputs.data }}
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_ID: ${{ steps.create.outputs.data && fromJSON(steps.create.outputs.data).id || steps.lookup_proof.outputs.release_id }}
        run: python cicd/release/verify_release.py retained --tag "$TAG" --sha "$SHA" --release-id "$EXPECTED_ID" --packages "$RUNNER_TEMP/packages" --missing "$RUNNER_TEMP/missing-packages"
      - uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de
        if: steps.retained.outputs.draft == 'true' && steps.retained.outputs.files != ''
        with:
          release_id: ${{ steps.retained.outputs.release_id }}
          repo_token: ${{ github.token }}
          tag: ${{ needs.build.outputs.tag }}
          target_commit: ${{ needs.build.outputs.sha }}
          file: ${{ runner.temp }}/missing-packages/*
          file_glob: true
          overwrite: false
          check_duplicates: true
          draft: true
          promote: false
          prerelease: false
          make_latest: false
      - uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae
        id: after_upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          route: GET /repos/{repo}/releases/{release_id}
          repo: ${{ github.repository }}
          release_id: ${{ steps.retained.outputs.release_id }}
      - name: Verify same ID and all remote bytes before publication
        id: complete
        env:
          RELEASE_OBSERVATION: ${{ steps.after_upload.outputs.data }}
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_ID: ${{ steps.retained.outputs.release_id }}
        run: |
          python cicd/release/verify_release.py retained --complete --tag "$TAG" --sha "$SHA" --release-id "$EXPECTED_ID" --packages "$RUNNER_TEMP/packages" --missing "$RUNNER_TEMP/missing-packages"
          python cicd/release/freeze.py remote --tag "$TAG" --sha "$SHA"
      - uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae
        if: steps.complete.outputs.draft == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          route: PATCH /repos/{repo}/releases/{release_id}
          repo: ${{ github.repository }}
          release_id: ${{ steps.complete.outputs.release_id }}
          draft: false
          make_latest: legacy
          body: ${{ toJSON(steps.complete.outputs.notes) }}
