                  destination = original / relative
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with destination.open('xb') as output:
                      output.write(source.read_bytes())
          command = str(binary.resolve(strict=True))
          if windows:
              # Rust canonicalize uses the verbatim prefix; Node realpath drops it again
              # when the Manager test obtains its ordinary trusted resource directory.
              command = os.path.realpath('\\\\?\\' + command, strict=True)
          clean_env = {key: os.environ[key] for key in ('SystemRoot', 'WINDIR') if key in os.environ}
          observed = subprocess.run([command, '--version'], cwd=root, env=clean_env,
              capture_output=True, check=True, timeout=15)
          assert not observed.stderr and len(observed.stdout) <= 256
          version = observed.stdout.decode().strip().split()
          assert len(version) == 2 and version[-1] == record['version'], 'Built/script/runtime identity mismatch'
          values = {'READER_BUDDY_ARCHIVE_TEST_COMMAND': command,
              'READER_BUDDY_ARCHIVE_TEST_BYTES': str(record['command']['bytes']),
              'READER_BUDDY_ARCHIVE_TEST_SHA256': record['command']['sha256'],
              'ORACLE_TEST_EXECUTABLE': str(test.resolve(strict=True))}
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for key, value in values.items():
                  output.write(key + '=' + value + '\n')
          PY
      - name: Exercise the retained command through the precompiled archive tests
