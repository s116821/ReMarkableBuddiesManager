        if: runner.os == 'Windows'
        run: node --test --test-name-pattern '^native Windows' tests/isolated-backup-verifier.test.mjs
      - name: Verify actual producer packages through the retained Manager oracle
        env:
          MANAGER_REQUIRE_RETAINED_ORACLE: "1"
        run: node --test --test-name-pattern '^retained host oracle' tests/isolated-backup-retained.test.mjs
      - name: Confirm native tests preserved command, harness and original provenance bytes
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['ORACLE_ROOT'])
          receipt = json.loads((root / 'receipt.json').read_text())
          target = 'x86_64-pc-windows-msvc' if os.name == 'nt' else 'x86_64-unknown-linux-gnu'
          record = receipt['platforms'][target]
          binary = Path(os.environ['READER_BUDDY_ARCHIVE_TEST_COMMAND'])
          test = Path(os.environ['ORACLE_TEST_EXECUTABLE'])
          for path, reference in [(binary, record['command']), (test, record['test'])]:
              assert path.stat().st_size == reference['bytes']
              with path.open('rb') as stream:
                  assert hashlib.file_digest(stream, 'sha256').hexdigest() == reference['sha256']
          original = (root / target / 'buddy-oracle/provenance.json').read_bytes()
          assert hashlib.sha256(original).hexdigest() == record['provenance_sha256']
          assert (binary.parent / 'provenance.json').read_bytes() == original
          PY
      - name: Confirm native qualification preserved every original ZIP
        run: python cicd/release/build.py verify --tag "$TAG" --sha "$SHA" --output "$RUNNER_TEMP/packages" --oracle-root "$ORACLE_ROOT"
    defaults:
      run:
        shell: bash
  release:
    name: Release
    timeout-minutes: 20
    needs:
      - build
      - integration
    if: inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      TAG: ${{ needs.build.outputs.tag }}
      SHA: ${{ needs.build.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: ./.github/actions/release-tools
        with:
          audit-dependencies: "false"
      - uses: octokit/graphql-action@ddde8ebb2493e79f390e6449c725c21663a67505
        id: merged
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          query: |
            query($owner: String!, $repo: String!, $sha: String!) {
              repository(owner: $owner, name: $repo) {
                object(expression: $sha) { ... on Commit {
                  oid associatedPullRequests(first: 10) { nodes {
                    merged baseRefName mergeCommit { oid }
                  } }
                } }
              }
            }
          variables: |
            owner: ${{ github.repository_owner }}
            repo: ${{ github.event.repository.name }}
            sha: ${{ needs.build.outputs.sha }}
      - name: Require exact merged-main admission
        env:
          RELEASE_OBSERVATION: ${{ steps.merged.outputs.data }}
        run: python cicd/release/admission.py merge --sha "$SHA"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/packages
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.development_artifact_id }}
          path: test-results/development
          merge-multiple: true
      - name: Validate and extract the original Build host test receipt
        env:
          HOST_ORACLE_TAR: ${{ github.workspace }}/test-results/development/host-oracle/buddy-host-tests.tar
        run: |
          python - <<'PY'
          import hashlib, json, os, re, tarfile
          from pathlib import Path, PurePosixPath

          manager = Path.cwd().resolve()
          scratch = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          archive_path = Path(os.environ['HOST_ORACLE_TAR']).resolve(strict=True)
          root = scratch / 'buddy-host-tests'
          pin = json.loads((manager / 'host/buddy-oracle-source.json').read_text())
          targets = {'x86_64-unknown-linux-gnu': 'archive_cli', 'x86_64-pc-windows-msvc': 'archive_cli.exe'}

          def digest(path):
              with path.open('rb') as source:
                  return hashlib.file_digest(source, 'sha256').hexdigest()

          with tarfile.open(archive_path, 'r:') as archive:
              members = archive.getmembers()
              assert 0 < len(members) <= 128 and sum(m.size for m in members) <= 1024**3
              names = set()
              for member in members:
                  path = PurePosixPath(member.name)
                  assert member.isfile() and not path.is_absolute() and '..' not in path.parts
                  assert '\\' not in member.name and ':' not in member.name
                  assert member.name == str(path) and member.name not in names
                  names.add(member.name)
              assert 'receipt.json' in names
              member = archive.getmember('receipt.json')
              assert member.size <= 64 * 1024
              receipt = json.load(archive.extractfile(member))
              assert set(receipt) == {'schema', 'source', 'manifest_directory', 'platforms', 'fixtures'}
              assert receipt['schema'] == 1 and receipt['source'] == pin
              assert set(receipt['platforms']) == set(targets)
              expected = {'receipt.json'}
              for target, record in receipt['platforms'].items():
                  assert record['target'] == target and record['test']['name'] == targets[target]
                  assert re.fullmatch('[0-9a-f]{64}', record['test']['sha256'])
                  assert 0 < record['test']['bytes'] <= 512 * 1024**2
                  assert re.fullmatch('[0-9a-f]{64}', record['provenance_sha256'])
                  expected.update(target + '/' + name for name in (targets[target], 'qualification.json', 'buddy-oracle/provenance.json'))
                  log_names = {'ordinary-build.jsonl', 'ordinary-build.stderr', 'test-build.jsonl', 'test-build.stderr'}
                  if target.endswith('windows-msvc'):
                      log_names.update(('pe-imports.txt', 'xwin-list.txt', 'xwin-download.txt',
                          'xwin-channel.json', 'xwin-packages.vsman', 'xwin-inputs.json'))
                  else:
                      log_names.add('elf-dependencies.txt')
                  assert set(record['logs']) == log_names
                  expected.update(target + '/' + name for name in log_names)
                  expected.update(target + '/notices/' + name for name in record['notices'])
                  assert all('/' not in name and '\\' not in name and name not in ('', '.', '..') for name in record['notices'])
              assert set(receipt['fixtures']) == {'docs/simulator/scenarios/writer-notebook-create-replay.json',
                  'docs/simulator/scenarios/writer-notebook-source.json'}
              expected.update('source-fixtures/' + name for name in receipt['fixtures'])
              assert names == expected, 'Unexpected CI tar membership'
              root.mkdir(exist_ok=False)
              for member in members:
                  destination = root / member.name
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with destination.open('xb') as output:
                      stream = archive.extractfile(member)
                      remaining = member.size
                      while remaining:
                          chunk = stream.read(min(64 * 1024, remaining))
                          assert chunk, 'Short CI member'
                          output.write(chunk)
                          remaining -= len(chunk)
                      assert not stream.read(1)
                  # Executable mode is retained inside tar, not by the artifact service.
                  expected_mode = 0o755 if member.name == 'x86_64-unknown-linux-gnu/archive_cli' else 0o644
                  assert member.mode == expected_mode
                  if os.name != 'nt':
                      destination.chmod(expected_mode)

          for target, record in receipt['platforms'].items():
              assert json.loads((root / target / 'qualification.json').read_text()) == record
              assert digest(root / target / 'buddy-oracle/provenance.json') == record['provenance_sha256']
              provenance = json.loads((root / target / 'buddy-oracle/provenance.json').read_text())
              assert provenance['source'] == pin and provenance['target'] == target
              assert provenance['executable'] == record['command'] and provenance['version'] == record['version']
              test = root / target / record['test']['name']
              assert test.stat().st_size == record['test']['bytes'] and digest(test) == record['test']['sha256']
              for name, entry in record['logs'].items():
                  file = root / target / name
                  assert file.stat().st_size == entry['bytes'] and digest(file) == entry['sha256']
              for name, entry in record['notices'].items():
                  file = root / target / 'notices' / name
                  assert file.stat().st_size == entry['bytes'] and digest(file) == entry['sha256']
          for name, entry in receipt['fixtures'].items():
              file = root / 'source-fixtures' / name
              assert file.stat().st_size == entry['bytes'] and digest(file) == entry['sha256']
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('ORACLE_ROOT=' + str(root) + '\n')
          PY
      - name: Verify the exact integration-tested upload inventory
        run: python cicd/release/build.py verify --tag "$TAG" --sha "$SHA" --output "$RUNNER_TEMP/packages" --oracle-root "$ORACLE_ROOT"
      - name: Official tag only after every preceding job passed
        run: |
          set -euo pipefail
          git checkout -B main "$SHA"
          python cicd/release/freeze.py candidate --require-semantic-source --tag "$TAG" --sha "$SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main --tags
          git merge-base --is-ancestor "$SHA" refs/remotes/origin/main
          test "$(semantic-release -c cicd/release/python-semantic-release.toml version --print-tag)" = "$TAG"
          semantic-release -c cicd/release/python-semantic-release.toml version --no-commit --no-changelog --skip-build --push --no-vcs-release
          python cicd/release/freeze.py remote --tag "$TAG" --sha "$SHA"
      - uses: octokit/graphql-action@ddde8ebb2493e79f390e6449c725c21663a67505
        id: lookup
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          query: |
            query($owner: String!, $repo: String!, $tag: String!) {
              repository(owner: $owner, name: $repo) {
                release(tagName: $tag) {
                  databaseId tagName isDraft description
                  releaseAssets(first: 1) { totalCount }
                }
              }
            }
          variables: |
            owner: ${{ github.repository_owner }}
            repo: ${{ github.event.repository.name }}
            tag: ${{ needs.build.outputs.tag }}
      - name: Validate exact release observation
        id: lookup_proof
        env:
          RELEASE_OBSERVATION: ${{ steps.lookup.outputs.data }}
        run: python cicd/release/verify_release.py lookup --tag "$TAG" --sha "$SHA"
      - uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae
        id: create
        if: steps.lookup_proof.outputs.absent == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          route: POST /repos/{repo}/releases
          repo: ${{ github.repository }}
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ needs.build.outputs.sha }}
          draft: true
          name: ${{ needs.build.outputs.tag }}
      - uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae
        id: before_upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          route: GET /repos/{repo}/releases/{release_id}
          repo: ${{ github.repository }}
          release_id: ${{ steps.create.outputs.data && fromJSON(steps.create.outputs.data).id || steps.lookup_proof.outputs.release_id }}
      - name: Verify retained bytes and select only missing names
        id: retained
        env:
          RELEASE_OBSERVATION: ${{ steps.before_upload.outputs.data }}
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_ID: ${{ steps.create.outputs.data && fromJSON(steps.create.outputs.data).id || steps.lookup_proof.outputs.release_id }}
        run: python cicd/release/verify_release.py retained --tag "$TAG" --sha "$SHA" --release-id "$EXPECTED_ID" --packages "$RUNNER_TEMP/packages" --missing "$RUNNER_TEMP/missing-packages" --oracle-root "$ORACLE_ROOT"
      - uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de
        if: steps.retained.outputs.draft == 'true' && steps.retained.outputs.files != ''
        with:
          release_id: ${{ steps.retained.outputs.release_id }}
          repo_token: ${{ github.token }}
          tag: ${{ needs.build.outputs.tag }}
          target_commit: ${{ needs.build.outputs.sha }}
          file: ${{ runner.temp }}/missing-packages/*
          file_glob: true
          overwrite: false
          check_duplicates: true
          draft: true
          promote: false
          prerelease: false
          make_latest: false
      - uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae
        id: after_upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          route: GET /repos/{repo}/releases/{release_id}
          repo: ${{ github.repository }}
          release_id: ${{ steps.retained.outputs.release_id }}
      - name: Verify same ID and all remote bytes before publication
        id: complete
        env:
          RELEASE_OBSERVATION: ${{ steps.after_upload.outputs.data }}
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_ID: ${{ steps.retained.outputs.release_id }}
        run: |
          python cicd/release/verify_release.py retained --complete --tag "$TAG" --sha "$SHA" --release-id "$EXPECTED_ID" --packages "$RUNNER_TEMP/packages" --missing "$RUNNER_TEMP/missing-packages" --oracle-root "$ORACLE_ROOT"
          python cicd/release/freeze.py remote --tag "$TAG" --sha "$SHA"
      - uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae
        if: steps.complete.outputs.draft == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          route: PATCH /repos/{repo}/releases/{release_id}
          repo: ${{ github.repository }}
          release_id: ${{ steps.complete.outputs.release_id }}
          draft: false
          make_latest: legacy
          body: ${{ toJSON(steps.complete.outputs.notes) }}
